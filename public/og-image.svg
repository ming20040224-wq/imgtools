    <circle cx="200" cy="500" r="3"/><circle cx="250" cy="500" r="3"/><circle cx="300" cy="500" r="3"/>
    <circle cx="350" cy="500" r="3"/><circle cx="400" cy="500" r="3"/>
    <circle cx="800" cy="500" r="3"/><circle cx="850" cy="500" r="3"/><circle cx="900" cy="500" r="3"/>
    <circle cx="950" cy="500" r="3"/><circle cx="1000" cy="500" r="3"/>
