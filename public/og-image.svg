      <stop offset="0%" stopColor="#0f0a1a"/>
      <stop offset="100%" stopColor="#1a1025"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="450" y1="180" x2="750" y2="280">
      <stop offset="0%" stopColor="#c084fc"/>
